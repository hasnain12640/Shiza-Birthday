<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#fff3b0,#ffc8dd 45%,#d9cbff);color:#4a3f6b;font-family:"Bradley Hand","Comic Sans MS",cursive;text-align:center}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;overflow-x:hidden}
.pol{background:#fff;padding:12px 12px 18px;box-shadow:0 10px 26px #0003;transform:rotate(-3deg);position:relative;animation:in 1s both;max-width:86vw}

.pol p{margin:10px 0 0;font-size:20px}

h1{font-size:clamp(30px,9vw,48px);margin:26px 0 8px;animation:in 1s .5s both}
.w{font-size:clamp(20px,5.6vw,28px);line-height:1.4;max-width:460px;animation:in 1s 1s both}
.fl{position:fixed;bottom:-40px;font-size:28px;animation:up 7s linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:.2}}
button{margin-top:18px;font:inherit;font-size:20px;background:#fff3b0;border:0;border-radius:30px;padding:12px 26px;box-shadow:0 5px 0 #e6cf6a;animation:in 1s 1.4s both;min-height:48px}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
